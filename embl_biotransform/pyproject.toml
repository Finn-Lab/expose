[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expose-biotransform"
version = "0.3.0"
description = "Predict a metagenome's biotransformation capabilities from EMBL-EBI evidence, and show the evidence behind each prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "requests>=2.31",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "flask>=3.0",
]

[project.optional-dependencies]
# The native desktop window. Without it `expose` still runs and opens a browser.
desktop = ["pywebview>=5.0"]
notebook = ["ipywidgets>=8.1", "jupyter>=1.0"]
mgnify2 = ["mgnipy>=0.2"]
chem = ["rdkit>=2023.9"]
dev = ["pytest>=8.0"]

[project.scripts]
expose = "expose_app.cli:main"

[project.urls]
MGnify = "https://www.ebi.ac.uk/metagenomics"

[tool.setuptools]
packages = ["embl_biotransform", "webapp", "expose_app"]

[tool.setuptools.package-data]
webapp = ["static/*"]
"*" = ["example_data/*.json"]
